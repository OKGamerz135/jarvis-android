name: Build APK

# Jobs, from least to most privileged:
#   test           read-only token, no secrets: hygiene checks + unit tests
#   dev-build      read-only token, no secrets: builds with THROWAWAY keys generated inside the job (any branch)
#   install-matrix read-only token, no secrets: real emulators on Android 12, 12L, 13, 16: clean install, update, refusals
#   release-build  main only, "production" environment: the ONLY job that sees the signing secrets; read-only token
#   publish        main only: the ONLY job with a write token; sees no secrets and never runs Gradle
#
# Release rules: nothing is published unless the tests passed, the APK is signed by the expected production
# certificate (repository variable JARVIS_CERT_SHA256), and the file that is published is byte-identical to the one
# that was built. Without the production secrets the release jobs fail and nothing is published.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  # Validation only: tests, hygiene checks, throwaway-key builds and the emulator matrix. A pull request never reaches
  # release-build or publish (both require a push to main), so it can neither read the production environment's
  # secrets nor create a release. Pull requests from forks get a read-only token and no secrets from GitHub as well.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Maintainer only: regenerate gradle/verification-metadata.xml on a clean runner and test it under enforcement. Needs no secrets.'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Build 40, the last build signed with the old (compromised) key. Used only to prove the clean-install path.
  BUILD40_URL: https://github.com/OKGamerz135/jarvis-android/releases/download/build-40/jarvis.apk
  BUILD40_SHA256: cceb7e3d8c53ab3e8a8f34de4a2383f4c564da7a980d85db56abe0aa33afdc21

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Signing hygiene self-test
        run: bash scripts/test-signing-hygiene.sh

      - name: Signing hygiene check (no keystores, no literal passwords, actions pinned)
        run: bash scripts/check-signing-hygiene.sh

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Count test results
        id: counts
        if: always()
        run: |
          s="$(python3 scripts/summarize-tests.py app/build/test-results/testDebugUnitTest || echo 'no results')"
          echo "summary=$s" >> "$GITHUB_OUTPUT"
          echo "$s"

      # The summary is put in a step name so the numbers are visible in the run's job list.
      - name: "Result: ${{ steps.counts.outputs.summary }}"
        if: always()
        run: echo "${{ steps.counts.outputs.summary }}"

  dev-build:
    if: github.ref != 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Two throwaway keys that exist only on this runner. They prove the environment-based signing path works and let
      # the emulator job test "other signer" refusals. They are not production keys and are never stored.
      - name: Create throwaway test keys
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dev"
          for k in key1 key2; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            echo "${k^^}_PW=$pw" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore "$RUNNER_TEMP/dev/$k.p12" -storetype PKCS12 -storepass "$pw" -keypass "$pw" \
              -alias dev -keyalg RSA -keysize 2048 -validity 2 -dname "CN=JARVIS throwaway $k" >/dev/null 2>&1
          done

      - name: Build A (key1) and B (key1, higher versionCode)
        run: |
          set -eu
          chmod +x gradlew
          export JARVIS_KEYSTORE_FILE="$RUNNER_TEMP/dev/key1.p12" JARVIS_KEYSTORE_PASSWORD="$KEY1_PW" JARVIS_KEY_ALIAS=dev JARVIS_KEY_PASSWORD="$KEY1_PW"
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/A.apk
          GITHUB_RUN_NUMBER=$((GITHUB_RUN_NUMBER + 1000)) ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dist/B.apk

      - name: C = B re-signed by a different key
        run: |
          set -eu
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/dev/key2.p12" --ks-pass env:KEY2_PW --key-pass env:KEY2_PW --ks-key-alias dev \
            --out dist/C.apk dist/B.apk

      - name: Verify signatures and that env-based signing used key1
        run: |
          set -eu
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          want="$(keytool -list -v -keystore "$RUNNER_TEMP/dev/key1.p12" -storepass "$KEY1_PW" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          for f in A B C; do
            "$APKSIGNER" verify --print-certs -v "dist/$f.apk" > "dist/$f.certs.txt"
            grep -E 'Verified using v[0-9.]+ scheme.*true' "dist/$f.certs.txt"
          done
          got="$(grep -m1 'certificate SHA-256 digest' dist/A.certs.txt | sed 's/.*: *//')"
          [ "$got" = "$want" ] && echo "A is signed by key1 ($got)" || { echo "A signer mismatch"; exit 1; }
          gotc="$(grep -m1 'certificate SHA-256 digest' dist/C.certs.txt | sed 's/.*: *//')"
          [ "$gotc" != "$want" ] && echo "C is signed by a different key" || { echo "C unexpectedly matches key1"; exit 1; }

      - name: Name the test APK
        run: cp dist/A.apk dist/jarvis.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-apks-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 7

      # Throwaway-key APK for a phone test. Each run uses a NEW key, so uninstall the previous test build first.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JARVIS-dev-build-${{ github.run_number }}
          path: dist/jarvis.apk
          retention-days: 7

  install-matrix:
    needs: dev-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 31 = Android 12, 32 = Android 12L, 33 = Android 13, 36 = Android 16
        api: [31, 32, 33, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-apks-${{ github.run_number }}
          path: dist

      - name: Fetch the released Build 40 (old key) and check its hash
        run: |
          set -eu
          curl -fsSL -o dist/build40.apk "$BUILD40_URL"
          echo "$BUILD40_SHA256  dist/build40.apk" | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install / update / refusal tests on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./scripts/emulator-install-test.sh dist/build40.apk dist/A.apk dist/B.apk dist/C.apk

  # H1a-1 (amendment to the H1 plan, Rev 3 section 8): dependency verification bootstrap. Runs ONLY when a person dispatches
  # the workflow with bootstrap=true. No secrets, no environment, read-only token, every cache off. It never runs on a
  # push or a pull request, and it never touches release-build.
  bootstrap-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Every cache off: nothing is restored and nothing is saved.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      # Same step as dev-build: throwaway keys that exist only on this runner, so assembleRelease signs without any secret.
      - name: Create throwaway test keys
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dev"
          for k in key1 key2; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            echo "${k^^}_PW=$pw" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore "$RUNNER_TEMP/dev/$k.p12" -storetype PKCS12 -storepass "$pw" -keypass "$pw" \
              -alias dev -keyalg RSA -keysize 2048 -validity 2 -dname "CN=JARVIS throwaway $k" >/dev/null 2>&1
          done

      - name: Generate verification metadata (tasks of the test and dev-build jobs, no build cache, tasks re-run)
        run: |
          set -eu
          chmod +x gradlew
          test ! -e gradle/verification-metadata.xml
          export JARVIS_KEYSTORE_FILE="$RUNNER_TEMP/dev/key1.p12" JARVIS_KEYSTORE_PASSWORD="$KEY1_PW" JARVIS_KEY_ALIAS=dev JARVIS_KEY_PASSWORD="$KEY1_PW"
          ./gradlew --no-daemon --no-build-cache --rerun-tasks --write-verification-metadata sha256 testDebugUnitTest assembleRelease
          test -s gradle/verification-metadata.xml
          grep -q '<verify-metadata>true</verify-metadata>' gradle/verification-metadata.xml
          grep -q '<verify-signatures>false</verify-signatures>' gradle/verification-metadata.xml
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/generated-metadata.xml"
          echo "BOOTSTRAP-GENERATION: PASS"

      - name: Print the metadata file into the log, numbered, with its SHA-256
        run: |
          set -eu
          f=gradle/verification-metadata.xml
          echo "BOOTSTRAP-METADATA-SHA256 $(sha256sum "$f" | cut -d' ' -f1)"
          echo "BOOTSTRAP-METADATA-LINES $(wc -l < "$f")"
          echo "BOOTSTRAP-METADATA-BYTES $(wc -c < "$f")"
          echo "BOOTSTRAP-METADATA-COMPONENTS $(grep -c '<component ' "$f")"
          echo "BOOTSTRAP-METADATA-BEGIN"
          awk '{ printf "MD %06d %s\n", NR, $0 }' "$f"
          echo "BOOTSTRAP-METADATA-END"

      # The same tasks again WITHOUT --write-verification-metadata, so the generated file is enforced. A brand-new Gradle
      # user home means nothing downloaded by the generation run is reused: every artifact is fetched and checked again.
      - name: Enforcement run (same tasks, metadata enforced, fresh Gradle user home, no cache)
        run: |
          set -eu
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-enforce"
          export JARVIS_KEYSTORE_FILE="$RUNNER_TEMP/dev/key1.p12" JARVIS_KEYSTORE_PASSWORD="$KEY1_PW" JARVIS_KEY_ALIAS=dev JARVIS_KEY_PASSWORD="$KEY1_PW"
          cmp gradle/verification-metadata.xml "$RUNNER_TEMP/generated-metadata.xml"
          ./gradlew --no-daemon --no-build-cache --rerun-tasks testDebugUnitTest assembleRelease
          cmp gradle/verification-metadata.xml "$RUNNER_TEMP/generated-metadata.xml"
          echo "BOOTSTRAP-ENFORCEMENT: PASS"

      # Proof that the enforcement run really enforces: with every checksum replaced by zeros, a fresh Gradle user home
      # must FAIL with a dependency verification error. The real file is put back and compared afterwards.
      - name: Negative control (tampered checksums must be refused)
        run: |
          set -eu
          f=gradle/verification-metadata.xml
          python3 - <<'PY'
          import re
          p = "gradle/verification-metadata.xml"
          s = open(p, encoding="utf-8").read()
          t, n = re.subn(r'(sha256 value=")[0-9a-fA-F]+(")', lambda m: m.group(1) + "0" * 64 + m.group(2), s)
          assert n > 0, "no sha256 entries found"
          open(p, "w", encoding="utf-8").write(t)
          print("tampered sha256 entries:", n)
          PY
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-negative"
          set +e
          ./gradlew --no-daemon --no-build-cache :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/negative.log" 2>&1
          code=$?
          set -e
          cp "$RUNNER_TEMP/generated-metadata.xml" "$f"
          tail -n 30 "$RUNNER_TEMP/negative.log"
          cmp "$f" "$RUNNER_TEMP/generated-metadata.xml"
          [ "$code" -ne 0 ] || { echo "BOOTSTRAP-NEGATIVE-CONTROL: FAIL (tampered metadata was accepted)"; exit 1; }
          grep -qi 'dependency verification failed' "$RUNNER_TEMP/negative.log" || { echo "BOOTSTRAP-NEGATIVE-CONTROL: FAIL (failed, but not with a verification error)"; exit 1; }
          echo "BOOTSTRAP-NEGATIVE-CONTROL: PASS"

      - name: Result
        run: |
          echo "BOOTSTRAP-RESULT generation=PASS enforcement=PASS negative-control=PASS components=$(grep -c '<component ' gradle/verification-metadata.xml) sha256=$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)"

  release-build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require production signing configuration
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PW: ${{ secrets.JARVIS_KEY_PASSWORD }}
          CERT: ${{ vars.JARVIS_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KS_B64" ] || missing="$missing JARVIS_KEYSTORE_BASE64"
          [ -n "$KS_PW" ] || missing="$missing JARVIS_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing JARVIS_KEY_ALIAS"
          [ -n "$KEY_PW" ] || missing="$missing JARVIS_KEY_PASSWORD"
          [ -n "$CERT" ] || missing="$missing JARVIS_CERT_SHA256(variable)"
          if [ -n "$missing" ]; then echo "::error::Production signing is not configured. Missing:$missing. Nothing will be published."; exit 1; fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and sign the release APK
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export JARVIS_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          # Fail early and clearly if this is not a PKCS12 store, the password is wrong or the alias is missing.
          # (-storepass:env keeps the password out of the process list and the log.)
          keytool -list -storetype PKCS12 -keystore "$JARVIS_KEYSTORE_FILE" \
            -storepass:env JARVIS_KEYSTORE_PASSWORD -alias "$JARVIS_KEY_ALIAS" >/dev/null \
            || { echo "::error::Cannot open the PKCS12 keystore with this password and alias."; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk jarvis.apk

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify the signer is the expected production certificate
        env:
          EXPECTED: ${{ vars.JARVIS_CERT_SHA256 }}
        run: |
          set -eu
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs -v jarvis.apk | tee certs.txt
          got="$(grep -m1 'certificate SHA-256 digest' certs.txt | sed 's/.*: *//' | tr 'A-F' 'a-f')"
          want="$(echo "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')"
          [ "$got" = "$want" ] || { echo "::error::Signer $got is not the expected certificate."; exit 1; }
          [ "$(grep -c 'Number of signers: 1' certs.txt)" = 1 ] || { echo "::error::Expected exactly one signer."; exit 1; }

      - name: Hash
        id: hash
        run: echo "sha256=$(sha256sum jarvis.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: jarvis.apk
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk

      - name: Check the file is the one that was built, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.release-build.outputs.sha256 }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          echo "$EXPECTED_SHA  jarvis.apk" | sha256sum -c -
          printf '%s\n\nSHA-256 of jarvis.apk: %s\n' "$COMMIT_MSG" "$EXPECTED_SHA" > notes.txt
          gh release create "build-$RUN_NUMBER" jarvis.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "JARVIS build $RUN_NUMBER" --notes-file notes.txt --latest
